# GitHub Action del Integrante 1 — Compilación y pruebas automáticas (Integración Continua)
# Se ejecuta en cada push y Pull Request hacia main o develop.
name: CI - Pruebas (Integrante 1)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas con Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test
