# GitHub Action del Integrante 3 — Contenedores
# Construye la imagen del Dockerfile y valida que docker-compose levante la aplicación.
name: Docker - Imagen y Compose (Integrante 3)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Construir imagen y probar Compose
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Validar sintaxis de docker-compose.yml
        run: docker compose config --quiet

      - name: Levantar la aplicación con Docker Compose
        run: docker compose up --build --detach --wait --wait-timeout 90

      - name: Prueba de humo (endpoint /health)
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused \
            http://localhost:3000/health
          curl --fail --silent --show-error http://localhost:3000/ --output /dev/null
          curl --fail --silent --show-error http://localhost:3000/api/productos --output /dev/null
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT count(*) FROM productos"'

      - name: Mostrar logs si algo falló
        if: failure()
        run: docker compose logs

      - name: Apagar y limpiar
        if: always()
        run: docker compose down --volumes
